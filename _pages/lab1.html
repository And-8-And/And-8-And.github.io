<style>
    /* Alap méretezés és reszponzivitás */
    #sakktabla {
        width: 40vw;         /* vw alapú reszponzív méretezés */
        height: 40vw;
        max-width: 500px;    /* Ne legyen túl nagy asztali gépen */
        max-height: 500px;
        min-width: 300px;
        min-height: 300px;
        margin: 2rem auto;   /* Középre igazítás */
        border: 4px solid #2c3e50;
        box-shadow: 10px 10px 20px rgba(0, 0, 0, 0.2); /* Árnyék */
        table-layout: fixed; /* A cellák garantáltan egyforma méretűek */
        background-color: #ecf0f1;
    }

    #sakktabla td {
        width: 12.5%;        /* 100% / 8 cella */
        height: 12.5%;
        transition: all 0.3s ease; /* Finom animáció a hover állapothoz */
    }

    /* Sakktábla minta nth-child használatával */
    
    /* Páratlan sorok (1, 3, 5, 7) színezése */
    #sakktabla tr:nth-child(odd) td:nth-child(odd) {
        background-color: #ecf0f1; /* Világos mező */
    }
    #sakktabla tr:nth-child(odd) td:nth-child(even) {
        background-color: #2c3e50; /* Sötét mező */
    }

    /* Páros sorok (2, 4, 6, 8) színezése */
    #sakktabla tr:nth-child(even) td:nth-child(odd) {
        background-color: #2c3e50; /* Sötét mező */
    }
    #sakktabla tr:nth-child(even) td:nth-child(even) {
        background-color: #ecf0f1; /* Világos mező */
    }

    /* Fókusz/Hover állapot (Pluszpont) */
    #sakktabla td:hover {
        background-color: #e74c3c !important; /* Színváltás narancsvörösre */
        transform: scale(0.9);                /* Pici zsugorodó animáció */
        box-shadow: inset 0 0 10px rgba(0,0,0,0.5); /* Belső árnyék */
        cursor: pointer;
    }
</style>
